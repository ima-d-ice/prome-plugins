[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prome-rag-plugins"
version = "0.1.0"
description = "Modular, extensible components for building production RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12"]
lancedb = ["lancedb>=0.41"]
faiss = ["faiss-cpu>=1.16"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.4"]
pymupdf = ["pymupdf>=1.24"]
pypdf = ["pypdf[crypto]>=4.0"]
docling = ["docling>=2.0"]
beautifulsoup = ["beautifulsoup4>=4.12"]
trafilatura = ["trafilatura>=1.8"]
docx = ["python-docx>=1.2"]
pptx = ["python-pptx>=1.0"]
office = [
    "python-docx>=1.2",
    "python-pptx>=1.0",
]
spreadsheets = [
    "openpyxl>=3.1",
    "pandas>=2.2",
]
xml = ["lxml>=5.0"]
code = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
]
images = [
    "pytesseract>=0.3.13",
    "pillow>=10.0",
]
# PaddleOCR is intentionally NOT in `images` (large, heavy deps). Opt in explicitly.
paddleocr = ["paddleocr>=2.7"]
audio = [
    "faster-whisper>=1.0",
    "av>=11",
    "numpy>=1.26",
]
video = [
    "av>=11",
    "numpy>=1.26",
]
observability = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
dev = [
    "pytest>=8.0",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.8",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "lxml>=5.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "pytesseract>=0.3.13",
    "pillow>=10.0",
    "faster-whisper>=1.0",
    "av>=11",
    "numpy>=1.26",
    "qdrant-client>=1.12",
    "lancedb>=0.41",
    "faiss-cpu>=1.16",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
]
reranking-qwen3 = [
    "sentence-transformers",
    "torch",
]
all = [
    "pymupdf>=1.24",
    "pypdf[crypto]>=4.0",
    "docling>=2.0",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.8",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "lxml>=5.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "pytesseract>=0.3.13",
    "pillow>=10.0",
    "faster-whisper>=1.0",
    "av>=11",
    "numpy>=1.26",
    "qdrant-client>=1.12",
    "lancedb>=0.41",
    "faiss-cpu>=1.16",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "pytest>=8.0",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Upstream ruff defaults (E4/E7/E9/F) plus warnings, import sorting, and pyupgrade.
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]

[tool.setuptools.packages.find]
include = ["parsers*", "chunkers*", "embeddings*", "vector_stores*", "retrieval*", "reranking*", "generation*", "loaders*", "observability*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
